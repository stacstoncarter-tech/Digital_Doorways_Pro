name: Power Clean checks
on:
  pull_request:
    paths:
      - 'power-clean-app/**'
  push:
    branches:
      - power-clean-app-foundation
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: power-clean-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
