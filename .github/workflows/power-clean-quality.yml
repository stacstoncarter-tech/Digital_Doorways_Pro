name: Power Clean quality gates
on:
  pull_request:
    paths:
      - 'power-clean-app/**'
      - '.github/workflows/power-clean-quality.yml'
  push:
    branches:
      - power-clean-app-foundation
      - 'safeguards/**'
    paths:
      - 'power-clean-app/**'
      - '.github/workflows/power-clean-quality.yml'
permissions:
  contents: read
concurrency:
  group: power-clean-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: power-clean-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power-clean-app/package-lock.json
      - run: npm ci
      - run: npm run test:regression
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
